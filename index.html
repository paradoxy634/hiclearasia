<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiclear has moved</title>
  <link rel="canonical" href="https://hiclearwater.com/">
  <meta http-equiv="refresh" content="6; url=https://hiclearwater.com/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #1c2a33;
    }
    main {
      max-width: 560px;
      margin: 24px;
      padding: 40px 32px;
      background: #fff;
      border-top: 6px solid #0b6e8f;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0 0 16px; line-height: 1.5; font-size: 17px; }
    a { color: #0b6e8f; }
    .button {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 20px;
      background: #0b6e8f;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    small { display: block; margin-top: 20px; color: #5a6b75; }
  </style>
</head>
<body>
  <main>
    <h1>We have moved!</h1>
    <p>See our new website at <a href="https://hiclearwater.com/">hiclearwater.com</a>.</p>
    <a class="button" href="https://hiclearwater.com/">Go to hiclearwater.com</a>
    <small>You will be taken to the new site automatically in a few seconds.</small>
  </main>
</body>
</html>
